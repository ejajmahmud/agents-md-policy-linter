[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-md-policy-linter"
version = "0.1.0"
description = "Parses, validates, and conflict-checks AGENTS.md and .agent/skills declarative instruction hierarchies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agents-md-policy-linter = "agents_md_policy_linter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents_md_policy_linter*"]
